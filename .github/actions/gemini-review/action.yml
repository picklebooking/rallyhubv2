name: Gemini PR review
description: Sends a pull request diff to the Gemini API and posts advisory inline review comments.

inputs:
  gemini-api-key:
    description: Gemini API key. Passed from a repository secret.
    required: true

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Fetch the pull request diff
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
      run: |
        if ! gh pr diff "$PR_NUMBER" --repo "$REPO" > "$RUNNER_TEMP/pr.diff"; then
          echo "::notice::could not fetch the pull request diff; skipping automated review"
          exit 0
        fi

    - name: Run the reviewer
      shell: bash
      env:
        GEMINI_API_KEY: ${{ inputs.gemini-api-key }}
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_TITLE: ${{ github.event.pull_request.title }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        DIFF_FILE: ${{ runner.temp }}/pr.diff
      run: node "$GITHUB_ACTION_PATH/review.mjs"
